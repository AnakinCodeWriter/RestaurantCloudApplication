{% extends "base.html" %}
{% block title %}Register • Restaurant{% endblock %}

{% block content %}
  <div class="card" style="max-width:560px; margin: 0 auto;">
    <h1>Create an account</h1>
    <p>Register to place orders and track them.</p>

    <form method="post" class="grid" style="gap:12px; margin-top:14px;">
      <div>
        <label for="email" class="badge">Email</label><br />
        <input
          id="email"
          type="email"
          name="email"
          required
          style="width:100%; padding:12px; margin-top:8px; border-radius:12px;
                 border:1px solid var(--border);
                 background: rgba(255,255,255,0.04);
                 color: var(--text);"
        />
      </div>

      <div>
        <label for="password" class="badge">Password</label><br />
        <input
          id="password"
          type="password"
          name="password"
          required
          style="width:100%; padding:12px; margin-top:8px; border-radius:12px;
                 border:1px solid var(--border);
                 background: rgba(255,255,255,0.04);
                 color: var(--text);"
        />
      </div>

      <button class="btn" type="submit" style="width:100%;">
        Create account
      </button>
    </form>

    <p style="margin-top:14px;">
      Already have an account?
      <a href="{{ url_for('login') }}">Login</a>
    </p>
  </div>
{% endblock %}

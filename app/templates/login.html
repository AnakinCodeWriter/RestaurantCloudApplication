{% extends "base.html" %}
{% block title %}Login • Restaurant{% endblock %}

{% block content %}
  <div class="card" style="max-width:560px; margin: 0 auto;">
    <h1>Login</h1>
    <p>Enter your details to access your account.</p>

    <form method="post" class="grid" style="gap:12px; margin-top:14px;">
      <div>
        <label for="email" class="badge">Email</label><br />
        <input id="email" type="email" name="email" required
               style="width:100%; padding:12px; margin-top:8px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text);" />
      </div>

      <div>
        <label for="password" class="badge">Password</label><br />
        <input id="password" type="password" name="password" required
               style="width:100%; padding:12px; margin-top:8px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text);" />
      </div>

      <button class="btn" type="submit" style="width:100%;">Login</button>
    </form>

    <p style="margin-top:14px;">
      No account?
      <a href="{{ url_for('register') }}">Register</a>
    </p>
  </div>
{% endblock %}

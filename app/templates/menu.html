<!doctype html>
<html>
  <head><title>Menu</title></head>
  <body>
    <h1>Menu</h1>

    <p>
      <a href="{{ url_for('cart_view') }}">View cart</a>
    </p>

    <p><a href="{{ url_for('home') }}">Home</a></p>

    {% if items %}
      <ul>
        {% for item in items %}
          <li>
            <strong>{{ item.name }}</strong> — £{{ item.price }}
            <em>({{ item.category }})</em>
            {% if item.tags %} — tags: {{ item.tags }}{% endif %}
            <form method="post"
                action="{{ url_for('cart_add', item_id=item.id) }}"
                style="display:inline;">
              <button type="submit">Add to cart</button>
            </form>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No menu items yet.</p>
    {% endif %}
  </body>
</html>
